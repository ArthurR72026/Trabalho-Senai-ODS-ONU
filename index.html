<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Catálogo de Projetos</title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/x-icon"
        href="favicon.ico"
    >


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS DO PROJETO
    ====================================================== -->

    <link
        rel="stylesheet"
        href="Ads.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="container text-center py-4">


            <!-- =================================================
                 BOTÕES DO TOPO
            ================================================== -->

            <div
                class="d-flex justify-content-between align-items-center mb-3"
            >


                <!-- BOTÃO DE ACESSO ÀS AVALIAÇÕES -->

                <button
                    type="button"
                    id="btnAbrirAvaliacoes"
                    class="btn btn-primary btn-acessar-avaliacoes"
                >
                    🔐 Acessar Avaliações
                </button>


                <!-- BOTÃO DE TEMA -->

                <button
                    id="btnTema"
                    class="btn btn-light"
                    onclick="alternarTema()"
                    title="Ativar tema claro"
                    type="button"
                >
                    🌙
                </button>


            </div>



            <!-- =================================================
                 LOGO
            ================================================== -->

            <h1 class="logo-art7">
                💻 Meu Catálogo
            </h1>


            <!-- =================================================
                 DESCRIÇÃO
            ================================================== -->

            <p class="descricao-header">
                Confira meus projetos e acesse cada um deles.
            </p>


        </div>

    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="container py-5">


        <!-- =================================================
             TÍTULO DOS PROJETOS
        ================================================== -->

        <section class="text-center mb-5">

            <h2 class="titulo-secao">
                Meus Projetos
            </h2>

            <p class="subtitulo-secao">
                Escolha um projeto abaixo para conhecer e acessar.
            </p>

        </section>



        <!-- =================================================
             LISTA DE PROJETOS
        ================================================== -->

        <section>

            <div
                id="listaProjetos"
                class="row g-4"
            >

                <!--
                    Os projetos serão inseridos
                    automaticamente pelo Ads.js.
                -->

            </div>

        </section>



        <!-- =================================================
             ÁREA DE ENVIO DE AVALIAÇÃO
        ================================================== -->

        <section
            id="areaAvaliacao"
            class="avaliacao-container mt-5"
        >


            <!-- TÍTULO -->

            <div class="text-center mb-4">

                <h2 class="titulo-secao">
                    ⭐ Avalie o Catálogo
                </h2>

                <p class="subtitulo-secao">
                    Sua opinião é importante para ajudar a melhorar o projeto.
                </p>

            </div>



            <!-- =================================================
                 FORMULÁRIO
            ================================================== -->

            <form
                id="formAvaliacao"
                class="form-avaliacao"
            >


                <!-- =================================================
                     NOME
                ================================================== -->

                <div class="mb-3">

                    <label
                        for="nomeAvaliacao"
                        class="form-label"
                    >
                        Nome
                    </label>


                    <input
                        type="text"
                        id="nomeAvaliacao"
                        name="nome"
                        class="form-control"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- =================================================
                     E-MAIL
                ================================================== -->

                <div class="mb-3">

                    <label
                        for="emailAvaliacao"
                        class="form-label"
                    >
                        E-mail
                    </label>


                    <input
                        type="email"
                        id="emailAvaliacao"
                        name="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- =================================================
                     NOTA
                ================================================== -->

                <div class="mb-3">

                    <label
                        for="notaAvaliacao"
                        class="form-label"
                    >
                        Nota
                    </label>


                    <select
                        id="notaAvaliacao"
                        name="nota"
                        class="form-select"
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Selecione uma nota
                        </option>


                        <option value="1">
                            ⭐ 1 - Muito ruim
                        </option>


                        <option value="2">
                            ⭐⭐ 2 - Ruim
                        </option>


                        <option value="3">
                            ⭐⭐⭐ 3 - Regular
                        </option>


                        <option value="4">
                            ⭐⭐⭐⭐ 4 - Bom
                        </option>


                        <option value="5">
                            ⭐⭐⭐⭐⭐ 5 - Excelente
                        </option>

                    </select>

                </div>



                <!-- =================================================
                     AVALIAÇÃO
                ================================================== -->

                <div class="mb-3">

                    <label
                        for="textoAvaliacao"
                        class="form-label"
                    >
                        Sua avaliação
                    </label>


                    <textarea
                        id="textoAvaliacao"
                        name="avaliacao"
                        class="form-control"
                        rows="5"
                        placeholder="Escreva sua opinião sobre o catálogo..."
                        required
                    ></textarea>

                </div>



                <!-- =================================================
                     BOTÃO ENVIAR
                ================================================== -->

                <div class="text-center">

                    <button
                        type="submit"
                        class="btn btn-success btn-enviar-avaliacao"
                    >
                        📩 Enviar Avaliação
                    </button>

                </div>


            </form>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer-art7">

        <div class="container">

            <p>
                © 2026 - Meu Catálogo de Projetos
            </p>


            <p class="mb-0">
                Desenvolvido por Arthur Roberto
            </p>

        </div>

    </footer>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->


    <!-- SWEETALERT2 -->

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>


    <!-- JAVASCRIPT DO PROJETO -->

    <script src="Ads.js"></script>


</body>

</html>
